name: Retrieval boundary contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-contract-tests.txt
      - run: python -m pip install -r requirements-contract-tests.txt
      - name: Test without models, PostgreSQL or Redis
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q --junitxml=contract-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-py${{ matrix.python }}
          path: contract-results.xml
  native-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synapse_contract
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: synapse_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synapse_contract -d synapse_contract"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-contract-tests.txt
      - run: python -m pip install -r requirements-contract-tests.txt
      - name: Native driver, auth, cache and evidence probe
        env:
          SYNAPSE_DISPOSABLE_CONTRACT: "1"
        run: python scripts/probe_native_retrieval.py
